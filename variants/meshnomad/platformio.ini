; MeshNomad build definitions. Every MeshNomad env lives in this file and extends
; an unchanged MeshCore env, so MeshCore variant files stay untouched.

[mn_esp32_net]
build_flags =
  -D WITH_NET_SERVICES=1
  -D TCP_CLI_PORT=5000
build_src_filter =
  +<helpers/net/*.cpp>
lib_deps =
  knolleary/PubSubClient @ ^2.8

[env:heltec_v4_mn_rpt]
extends = env:heltec_v4_repeater
build_flags =
  ${env:heltec_v4_repeater.build_flags}
  ${mn_esp32_net.build_flags}
build_src_filter =
  ${env:heltec_v4_repeater.build_src_filter}
  ${mn_esp32_net.build_src_filter}
lib_deps =
  ${env:heltec_v4_repeater.lib_deps}
  ${mn_esp32_net.lib_deps}
