; MeshNomad build definitions. Every MeshNomad env lives in this file and extends
; an unchanged MeshCore env, so MeshCore variant files stay untouched.
; Envs below the "generated" marker come from tool/meshnomad/gen_envs.py.

[mn_release]
build_flags =
  -D MESHNOMAD_BUILD=1
build_unflags =
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -D BLE_DEBUG_LOGGING=1
  -D WIFI_DEBUG_LOGGING=1

; esptool 4.8.1 instead of the 4.5.1 that espressif32@6.11.0 brings: over the chip's own
; USB (USB-Serial/JTAG) 4.5.1 leaves the ESP32-S3 super watchdog running, so a board whose
; firmware was broken by an interrupted upload resets during the erase and cannot be
; flashed again with `pio run -t upload`.
[mn_esp32_tools]
platform_packages =
  platformio/tool-esptoolpy @ 1.40801.0

[mn_esp32_net]
build_flags =
  -D WITH_NET_SERVICES=1
  -D TCP_CLI_PORT=5000
build_src_filter =
  +<helpers/net/*.cpp>
lib_deps =
  knolleary/PubSubClient @ ^2.8

[mn_cmp_usb]
build_flags =
  -D ENABLE_USB_INTERFACE=1

[mn_cmp_wifi]
build_flags =
  -D ENABLE_WIFI_INTERFACE
build_src_filter =
  +<helpers/wifi/*.cpp>

[mn_cmp_net]
build_flags =
  -D NET_WIFI_EXTERNAL=1

