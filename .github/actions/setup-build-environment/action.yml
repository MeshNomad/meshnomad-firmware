name: Setup Build Environment
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # Tag "rpt-v1.18.0-meshnomad.3": GIT_TAG_VERSION = "v1.18.0-meshnomad.3" (release title),
    # FIRMWARE_VERSION_BASE = "v1.18.0-meshnomad" (compiled into the firmware; the release
    # counter lives only in the tag). Branch builds use the branch name for both.
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_STRING="v${GIT_TAG_NAME#*-v}"
        else
          # strip "refs/heads/" prefix and replace any remaining "/" with "-" to protect file paths
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION_STRING=$(echo "$BRANCH_NAME" | tr '/' '-')
        fi
        if [[ "${VERSION_STRING}" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+-meshnomad)\.[0-9]+$ ]]; then
          FIRMWARE_VERSION_BASE="${BASH_REMATCH[1]}"
        else
          FIRMWARE_VERSION_BASE="${VERSION_STRING}"
        fi
        echo "GIT_TAG_VERSION=${VERSION_STRING}" >> $GITHUB_ENV
        echo "FIRMWARE_VERSION_BASE=${FIRMWARE_VERSION_BASE}" >> $GITHUB_ENV
