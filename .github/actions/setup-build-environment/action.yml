name: Setup Build Environment
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # Tag "rpt-v1.18.0-meshnomad.3": GIT_TAG_VERSION = "v1.18.0-meshnomad.3" — used in the
    # release title, compiled into the firmware and in the file names. Branch builds get
    # "<MeshCore version>-meshnomad.dev", e.g. "v1.18.0-meshnomad.dev"; build.sh appends the commit.
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_STRING="v${GIT_TAG_NAME#*-v}"
        else
          BASE=$(sed -nE 's/.*define FIRMWARE_VERSION +"(v[0-9.]+)".*/\1/p' \
            examples/simple_repeater/MyMesh.h | head -n 1)
          VERSION_STRING="${BASE:-v0.0.0}-meshnomad.dev"
        fi
        echo "GIT_TAG_VERSION=${VERSION_STRING}" >> $GITHUB_ENV
