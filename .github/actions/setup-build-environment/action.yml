name: Setup Build Environment
description: Python, PlatformIO and the firmware version for MeshNomad builds
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # Tag "rpt-v1.18.0-meshnomad.3": GIT_TAG_VERSION = "v1.18.0-meshnomad.3" — used in the
    # release title, compiled into the firmware and in the file names. Branch builds get
    # "<MeshCore version>-meshnomad.dev", e.g. "v1.18.0-meshnomad.dev"; build.sh appends the commit.
    # The tag name reaches $GITHUB_ENV only after the version check below, so a crafted tag
    # cannot inject other variables.
    - name: Extract Version from Git Tag
      shell: bash
      run: | # zizmor: ignore[github-env] value is checked against a strict pattern first
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_STRING="v${GIT_TAG_NAME#*-v}"
        else
          BASE=$(sed -nE 's/.*define FIRMWARE_VERSION +"(v[0-9.]+)".*/\1/p' \
            examples/simple_repeater/MyMesh.h | head -n 1)
          VERSION_STRING="${BASE:-v0.0.0}-meshnomad.dev"
        fi
        if [[ ! "${VERSION_STRING}" =~ ^v[0-9]+(\.[0-9]+)*-meshnomad\.[0-9a-z.]+$ ]]; then
          echo "::error::Unexpected firmware version '${VERSION_STRING}' from ${GITHUB_REF}"
          exit 1
        fi
        echo "GIT_TAG_VERSION=${VERSION_STRING}" >> "$GITHUB_ENV"
