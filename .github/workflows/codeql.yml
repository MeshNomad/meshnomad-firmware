name: CodeQL

# C/C++ code scanning. CodeQL watches a real PlatformIO build of the Heltec V4 repeater,
# companion and room server, which together compile the code of all three roles.
# PlatformIO keeps its libraries and build output outside the checkout, so alerts
# cover this repository's code only. Results: Security tab, Code scanning.

on:
  push:
    branches: [main-meshnomad]
  pull_request:
    branches: [dev-meshnomad, main-meshnomad]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        env:
          PLATFORMIO_WORKSPACE_DIR: ${{ runner.temp }}/pio
        run: pio run -e heltec_v4_mn_rpt -e heltec_v4_mn_cmp -e heltec_v4_mn_rs

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:c-cpp
