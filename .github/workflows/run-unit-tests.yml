name: Run Unit Tests

on:
  # No push trigger: main-meshnomad is fast-forwarded to a commit this job
  # already passed on in its pull request.
  pull_request:
    branches: [main-meshnomad]
    # Documentation-only changes cannot break the code under test.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'logo/**'
      - 'include/README'
      - 'license.txt'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Run Unit Tests
        run: pio test -e native -e native_kiss_modem -vv

      - name: Upload Test Results
        # Upload test results even if the test step failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pio/build/native/
