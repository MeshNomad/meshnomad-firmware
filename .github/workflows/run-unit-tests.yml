name: Run Unit Tests

on:
  # No push trigger: dev-meshnomad and main-meshnomad are fast-forwarded to a
  # commit this job already passed on in its pull request.
  pull_request:
    branches: [dev-meshnomad, main-meshnomad]
    # Documentation-only changes cannot break the code under test.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'logo/**'
      - 'include/README'
      - 'license.txt'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Run Unit Tests
        run: pio test -e native -e native_kiss_modem -vv

      - name: Upload Test Results
        # Upload test results even if the test step failed.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: .pio/build/native/
