name: Build Repeater Firmwares

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - 'rpt-v*'

jobs:
  build-repeater-firmwares:
    # Upper bound for firmware-builder.yml; only its create-release job uses the write scopes.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'repeater'
      release_title_prefix: 'RPT'
