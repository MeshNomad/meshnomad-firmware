name: PR Build Check

on:
  pull_request:
    branches: [main-meshnomad]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
      - 'tool/meshnomad/**'
  push:
    branches: [main-meshnomad]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
      - 'tool/meshnomad/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # ESP32-S3 (most common platform)
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_repeater
          - Heltec_v3_room_server
          # nRF52
          - RAK_4631_companion_radio_ble
          - RAK_4631_companion_radio_ethernet
          - RAK_4631_repeater
          - RAK_4631_repeater_ethernet
          - RAK_4631_room_server
          - RAK_4631_room_server_ethernet
          # RP2040
          - PicoW_repeater
          # STM32
          - wio-e5-mini_repeater
          # ESP32-C6
          - LilyGo_Tlora_C6_repeater_
          # LR1110 (nRF52)
          - wio_wm1110_repeater
          # SX1276 (ESP32)
          - Tbeam_SX1276_repeater
          # MeshNomad: repeater with the network layer
          - heltec_v4_mn_rpt
          - Xiao_C3_mn_rpt
          - heltec_v4_mn_cmp
          - Xiao_C3_mn_cmp
          - heltec_v4_mn_rs
          - Xiao_C3_mn_rs

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  generated-envs:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Check MeshNomad generated envs
        run: python3 tool/meshnomad/gen_envs.py --check
