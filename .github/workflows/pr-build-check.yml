name: PR Build Check

on:
  pull_request:
    branches: [main-meshnomad]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'boards/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
      - '.github/workflows/build-dev-firmware.yml'
      - '.github/actions/**'
      - 'tool/meshnomad/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # ESP32-S3
          - heltec_v4_mn_rpt
          - heltec_v4_mn_cmp
          - heltec_v4_mn_rs
          # ESP32-C3
          - Xiao_C3_mn_rpt
          - Xiao_C3_mn_cmp
          - Xiao_C3_mn_rs
          # ESP32
          - Tbeam_SX1262_mn_rpt
          # ESP32-C6
          - M5Stack_Unit_C6L_mn_rpt

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  generated-envs:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Check MeshNomad generated envs
        run: python3 tool/meshnomad/gen_envs.py --check

      - name: Check for unsupported board code
        run: python3 tool/meshnomad/drop_unsupported.py --check
