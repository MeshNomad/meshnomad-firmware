name: PR Build Check

on:
  pull_request:
    branches: [dev-meshnomad, main-meshnomad]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'boards/**'
      - 'platformio.ini'
      - 'merge-bin.py'
      - 'build.sh'
      - '.github/workflows/pr-build-check.yml'
      - '.github/workflows/build-dev-firmware.yml'
      - '.github/actions/**'
      - 'tool/meshnomad/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          # ESP32-S3
          - heltec_v4_mn_rpt
          - heltec_v4_mn_cmp
          - heltec_v4_mn_rs
          # ESP32-C3 (companion only; repeater and room server cannot hold TLS, see tool/meshnomad/gen_envs.py)
          - Xiao_C3_mn_cmp
          # ESP32
          - Tbeam_SX1262_mn_rpt
          # ESP32-C6
          - M5Stack_Unit_C6L_mn_rpt

    steps:
      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: pio run -e "$ENVIRONMENT"

  generated-envs:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Check MeshNomad generated envs
        run: python3 tool/meshnomad/gen_envs.py --check

      - name: Check for unsupported board code
        run: python3 tool/meshnomad/drop_unsupported.py --check
