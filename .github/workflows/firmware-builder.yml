name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string

# GitHub occasionally delivers a duplicate 'push' webhook for one tag push, firing this
# workflow twice for the same ref; both runs would race on the release. Keyed on ref +
# firmware_type so rpt/cmp/rs stay independent while true duplicates collapse.
concurrency:
  group: firmware-builder-${{ inputs.firmware_type }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-build-targets.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        env:
          FIRMWARE_TYPE: ${{ inputs.firmware_type }}
        run: |
          # get list of firmwares to build
          TARGET_LIST=$(/usr/bin/env bash build.sh "get-${FIRMWARE_TYPE}-firmwares-to-build")
          
          # convert targets separated by new line into a json array string
          JSON_ARRAY=$(echo "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # use json array as targets result
          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    continue-on-error: true # don't fail entire build if one board fails to build
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-build-matrix.outputs.targets) }}
      fail-fast: false # don't cancel other builds if one board fails to build
    steps:

      - name: Clone Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
          TARGET: ${{ matrix.target }}
        run: /usr/bin/env bash build.sh build-firmware "$TARGET"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "${{ matrix.target }}"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only create release for tagged builds
    steps:

      - name: Clone Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: out

      - name: Compare partition tables with the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/meshnomad/partition_changes.py "${GITHUB_REF#refs/tags/}" out > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "${{ inputs.release_title_prefix }}-${{ env.GIT_TAG_VERSION }}"
          body_path: release-notes.md
          generate_release_notes: true
          draft: true
          files: out/*
