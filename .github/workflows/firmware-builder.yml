name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string

# GitHub occasionally delivers a duplicate 'push' webhook for one tag push, firing this
# workflow twice for the same ref; both runs would race on the release. Keyed on ref +
# firmware_type so rpt/cmp/rs stay independent while true duplicates collapse.
concurrency:
  group: firmware-builder-${{ inputs.firmware_type }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only create-release writes the release and signs the attestation.
permissions:
  contents: read

jobs:

  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-build-targets.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        env:
          FIRMWARE_TYPE: ${{ inputs.firmware_type }}
        run: |
          # get list of firmwares to build
          TARGET_LIST=$(/usr/bin/env bash build.sh "get-${FIRMWARE_TYPE}-firmwares-to-build")
          
          # convert targets separated by new line into a json array string
          JSON_ARRAY=$(echo "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # use json array as targets result
          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    continue-on-error: true # don't fail entire build if one board fails to build
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-build-matrix.outputs.targets) }}
      fail-fast: false # don't cancel other builds if one board fails to build
    steps:

      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
          TARGET: ${{ matrix.target }}
        run: /usr/bin/env bash build.sh build-firmware "$TARGET"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "${{ matrix.target }}"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only create release for tagged builds
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:

      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0               # release notes: history and tags since the previous release

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: out

      # Signed build provenance for every release file; check with
      # `gh attestation verify <file> -R MeshNomad/meshnomad-firmware` (SECURITY.md).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'out/*'

      - name: Compare partition tables with the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/meshnomad/partition_changes.py "${GITHUB_REF#refs/tags/}" out > release-notes.md

      # Release notes from the MeshNomad commits since the previous release of the same role
      # (cliff.toml; MeshCore commits are excluded through .cliffignore).
      - name: Determine release notes range
        id: range
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREFIX="${TAG%%v[0-9]*}"
          PREV=$(git describe --tags --abbrev=0 --match "${PREFIX}v[0-9]*" "${TAG}^" 2>/dev/null || true)
          [ -n "$PREV" ] || PREV=81dbae59   # MeshCore 1.18.0, the base of the fork
          sh tool/meshnomad/cliff_ignore.sh
          {
            echo "range=${PREV}..${TAG}"
            echo "pattern=^${PREFIX}v[0-9]"
          } >> "$GITHUB_OUTPUT"
          echo "Release notes range: ${PREV}..${TAG}"

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --strip header --tag-pattern "${{ steps.range.outputs.pattern }}" ${{ steps.range.outputs.range }}
        env:
          OUTPUT: CHANGES.md

      - name: Assemble release notes
        run: |
          {
            echo
            cat CHANGES.md
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main-meshnomad/CHANGELOG.md)"
          } >> release-notes.md
          cat release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "${{ inputs.release_title_prefix }}-${{ env.GIT_TAG_VERSION }}"
          body_path: release-notes.md
          generate_release_notes: false
          draft: true
          files: out/*
