name: Scorecard

# OpenSSF Scorecard: checks the repository's security practices (pinned actions, token
# permissions, branch rules, code scanning, ...). Results: Security tab, Code scanning,
# and https://scorecard.dev/viewer/?uri=github.com/MeshNomad/meshnomad-firmware.
# Publishing results restricts this workflow: no workflow-level write permissions or env,
# and the analysis job may only use checkout, upload-artifact, upload-sarif and the
# scorecard action itself.

on:
  push:
    branches: [main-meshnomad]
  schedule:
    - cron: '23 5 * * 1'
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Clone Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
