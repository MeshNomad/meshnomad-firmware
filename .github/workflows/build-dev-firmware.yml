name: Build Dev Firmware

# Manual development builds from dev-meshnomad. Pick boards with the two lists or with
# paths such as heltec/heltec_v4/rpt (see tool/meshnomad/dev_build.py, which also starts
# this workflow from a terminal). Every run publishes its own prerelease per role, tagged
# dev-<role>-<run number> (e.g. dev-cmp-57), version v1.18.0-meshnomad.dev.57-<commit>;
# the newest 20 per role are kept. Release tags (rpt-/cmp-/rs-) stay on main-meshnomad.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Vendor or vendor/board ("all" = every board)'
        type: choice
        default: all
        options:
          # >>> targets (generated by tool/meshnomad/gen_envs.py)
          - all
          - bq
          - bq/station_g2
          - bq/station_g2_logging
          - bq/station_g3_esp32
          - bq/station_g3_esp32_logging
          - ebyte
          - ebyte/ebyte_eora-s3
          - elecrow
          - elecrow/thinknode_m2
          - elecrow/thinknode_m5
          - elecrow/thinknode_m7
          - generic
          - generic/generic_e22_sx1262
          - generic/generic_e22_sx1268
          - heltec
          - heltec/heltec_ct62
          - heltec/heltec_e213
          - heltec/heltec_e290
          - heltec/heltec_rc32
          - heltec/heltec_rc32_without_display
          - heltec/heltec_tracker_v2
          - heltec/heltec_v2
          - heltec/heltec_v3
          - heltec/heltec_v4
          - heltec/heltec_v4_expansionkit
          - heltec/heltec_v4_r8
          - heltec/heltec_v4_r8_tft
          - heltec/heltec_v4_tft
          - heltec/heltec_wireless_paper
          - heltec/heltec_wireless_tracker
          - heltec/heltec_wsl3
          - lilygo
          - lilygo/lilygo_t3s3_sx1262
          - lilygo/lilygo_t3s3_sx1276
          - lilygo/lilygo_tbeam_1w
          - lilygo/lilygo_tdeck
          - lilygo/lilygo_teth_elite_sx1262
          - lilygo/lilygo_tlora_v2_1_1_6
          - lilygo/t_beam_s3_supreme_sx1262
          - lilygo/tbeam_sx1262
          - lilygo/tbeam_sx1276
          - m5stack
          - m5stack/m5stack_unit_c6l
          - meshadventurer
          - meshadventurer/meshadventurer_sx1262
          - meshadventurer/meshadventurer_sx1268
          - meshnology
          - meshnology/meshnology_w12
          - rak
          - rak/rak_3112
          - seeed
          - seeed/xiao_c3
          - seeed/xiao_s3
          - seeed/xiao_s3_wio
          - tenstar
          - tenstar/tenstar_c3_sx1262
          - tenstar/tenstar_c3_sx1268
          - waveshare
          - waveshare/waveshare_s3_lr1121
          # <<< targets
      role:
        description: 'Role'
        type: choice
        default: all
        options:
          - all
          - rpt
          - cmp
          - rs
      paths:
        description: 'Instead of the lists: paths such as heltec/heltec_v4/rpt, lilygo/*/cmp'
        type: string
        required: false

concurrency:
  group: dev-firmware
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Only from dev-meshnomad
        if: github.ref != 'refs/heads/dev-meshnomad'
        run: |
          echo "::error::Dev builds run only on dev-meshnomad, not on $GITHUB_REF"
          exit 1

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Resolve targets
        id: resolve
        env:
          TARGET: ${{ inputs.target }}
          ROLE: ${{ inputs.role }}
          PATHS: ${{ inputs.paths }}
        run: |
          TARGETS=$(python3 tool/meshnomad/dev_build.py --resolve \
            --target "$TARGET" --role "$ROLE" --paths "$PATHS")
          echo "$TARGETS"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.resolve.outputs.targets) }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}.${{ github.run_number }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.target }}"
          path: out

  prerelease:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Publish one prerelease per role
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          KEEP=20
          for ROLE in rpt cmp rs; do
            FILES=(out/*_mn_${ROLE}-*)
            [ -e "${FILES[0]}" ] || continue
            # e.g. heltec_v4_mn_rpt-v1.18.0-meshnomad.dev.57-abc1234.bin -> v1.18.0-meshnomad.dev.57-abc1234
            VERSION=$(basename "${FILES[0]}" | sed -E "s/^.*_mn_${ROLE}-(v.*)(-merged)?\.bin$/\1/; s/-merged$//")
            ENVS=$(for F in "${FILES[@]}"; do basename "$F" | sed -E 's/-v[0-9].*$//'; done | sort -u | tr '\n' ' ')
            TAG="dev-${ROLE}-${RUN}"
            if gh release view "$TAG" > /dev/null 2>&1; then
              # Re-run of the same run: same tag, replace its files.
              gh release upload "$TAG" "${FILES[@]}" license.txt --clobber
            else
              gh release create "$TAG" "${FILES[@]}" license.txt \
                --target "$GITHUB_SHA" --prerelease \
                --title "DEV-${ROLE^^} #${RUN} ${VERSION}" \
                --notes "Development build ${VERSION} from dev-meshnomad (${RUN_URL}). Not a release: it may be unstable. Firmware: ${ENVS}"
            fi
            # Keep the newest KEEP dev builds of this role; never touch any other tag.
            gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | grep -E "^dev-${ROLE}-[0-9]+$" | sort -t- -k3 -n -r | tail -n +$((KEEP + 1)) \
              | while read -r OLD; do gh release delete "$OLD" --cleanup-tag --yes; done
          done
